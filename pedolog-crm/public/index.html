<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Podo Master CRM</title>
<meta name="theme-color" content="#007D79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Podo Master">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23007D79%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-size=%2230%22 font-family=%22Arial%22 font-weight=%22800%22 fill=%22white%22 text-anchor=%22middle%22%3EPM%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tablet-first — fixed left rail with the PODO MASTER wordmark, work area on the right; phone width swaps the rail for a bottom bar */
:root{
  --tq:#00C1C0; --tq-d:#007D79; --tq-l:#E0F7F7; --tq-glow:rgba(0,193,192,.35);
  --ink:#333333; --muted:#6a7b7b; --bg:#F5F5F5; --card:#ffffff; --line:#e1eaea; --soft:#f0f6f6;
  --red:#d0213a; --red-l:#fde8eb; --amber:#b77900; --amber-l:#fff3dc; --green:#14895a; --green-l:#e2f6ec;
  --btn-ink:#ffffff; --shadow:0 1px 2px rgba(0,60,60,.06),0 6px 20px rgba(0,60,60,.06);
  --f:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --tq:#19d3d2; --tq-d:#00a09e; --tq-l:#0d3433; --tq-glow:rgba(25,211,210,.3);
  --ink:#e6f0ef; --muted:#93a9a7; --bg:#0d1515; --card:#142020; --line:#223737; --soft:#182828;
  --red:#ff5a6e; --red-l:#3a1720; --amber:#f0b440; --amber-l:#33280f; --green:#3fcf8e; --green-l:#0f2d20;
  --btn-ink:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --tq:#19d3d2; --tq-d:#00a09e; --tq-l:#0d3433; --tq-glow:rgba(25,211,210,.3);
  --ink:#e6f0ef; --muted:#93a9a7; --bg:#0d1515; --card:#142020; --line:#223737; --soft:#182828;
  --red:#ff5a6e; --red-l:#3a1720; --amber:#f0b440; --amber-l:#33280f; --green:#3fcf8e; --green-l:#0f2d20;
  --btn-ink:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.net.off{color:var(--red)}.net.off::before{background:var(--red);box-shadow:0 0 0 3px var(--red-l)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));gap:6px}
.logo{display:flex;flex-direction:column;gap:3px;padding:2px 10px 18px}
.logo b{font-weight:800;font-size:21px;letter-spacing:-.04em;line-height:1}
.logo b em{font-style:normal;color:var(--tq)}
.logo span{font-size:8.5px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.logo i{display:block;height:3px;width:46px;border-radius:3px;background:var(--tq);box-shadow:0 0 12px var(--tq-glow);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 12px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;text-align:left;position:relative;min-height:48px}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--tq-l);color:var(--tq-d)}
:root[data-theme="dark"] .nav button.on{color:var(--tq)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button.on{color:var(--tq)}}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.who{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--soft)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tq);color:#fff;font-weight:800;flex:none}
.who small{display:block;color:var(--muted);font-size:12px}
.who div{min-width:0}
.who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.04em;margin-right:auto}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.clock b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.clock small{color:var(--muted);font-size:12px}
.content{padding-block:22px 40px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--tq-d);border-color:var(--tq-d);color:var(--btn-ink)}
.btn.pri:hover{background:var(--tq);border-color:var(--tq)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.danger.fill{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.big{min-height:56px;font-size:17px;padding:12px 24px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.s-wait{background:var(--soft);color:var(--muted)}
.s-in{background:var(--tq-l);color:var(--tq-d)}
.s-done{background:var(--green-l);color:var(--green)}
.s-no{background:var(--red-l);color:var(--red)}
.s-cancel{background:var(--soft);color:var(--muted);text-decoration:line-through}
:root[data-theme="dark"] .s-in{color:var(--tq)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .s-in{color:var(--tq)}}
.tag{display:inline-flex;align-items:center;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--tq-l);color:var(--tq-d)}
.tag.warn{background:var(--red-l);color:var(--red)}
:root[data-theme="dark"] .tag{color:var(--tq)} :root[data-theme="dark"] .tag.warn{color:var(--red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--tq)}:root:not([data-theme="light"]) .tag.warn{color:var(--red)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:800;margin-right:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--amber-l);color:var(--amber);font-weight:600}
.banner .btn{margin-left:auto}

/* forms */
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.inp{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:16px;font-weight:500;color:var(--ink);min-height:48px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--tq);box-shadow:0 0 0 4px var(--tq-glow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:30px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--tq-d);border-color:var(--tq-d);color:#fff}
.chip.red.on{background:var(--red);border-color:var(--red)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat.hl b{color:var(--tq-d)}
:root[data-theme="dark"] .stat.hl b{color:var(--tq)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.hl b{color:var(--tq)}}

/* focus card */
.focus{position:relative;overflow:hidden;padding:24px;display:grid;grid-template-columns:1fr auto;gap:18px;border:0;color:#fff;background:linear-gradient(135deg,#007D79 0%,#00a3a2 60%,#00C1C0 100%)}
.focus::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:0 0 40px rgba(255,255,255,.25) inset}
.focus .eyebrow{color:rgba(255,255,255,.85)}
.focus h2{font-size:34px;font-weight:800;letter-spacing:-.045em;margin:6px 0 4px}
.focus .meta{display:flex;gap:16px;flex-wrap:wrap;font-weight:600;opacity:.95}
.focus .tag{background:rgba(255,255,255,.18);color:#fff}
.focus .tag.warn{background:#ff5a6e;color:#fff}
.focus .last{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.14);font-size:14px;max-width:640px}
.focus .acts{display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative;z-index:1}
.focus .btn{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff}
.focus .btn.pri{background:#fff;color:#007D79;border-color:#fff}
.count{font-size:15px;font-weight:700;background:rgba(255,255,255,.18);border-radius:30px;padding:4px 12px;display:inline-block}
.count.late{background:#ff5a6e}
.focus-thumb{width:120px;height:90px;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.5)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.tl-row:first-child{border-top:0}
.tl-row:hover{background:var(--soft)}
.tl-time{font-size:19px;font-weight:800;letter-spacing:-.03em}
.tl-name{font-weight:700;font-size:16px}
.tl-sub{font-size:13px;color:var(--muted)}
.tl-row.now{background:var(--tq-l)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}

/* schedule */
.sched{display:flex;flex-direction:column}
.hr{display:grid;grid-template-columns:72px 1fr;min-height:64px;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hr-l{padding:10px 14px;font-weight:700;color:var(--muted);font-size:14px}
.hr-c{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;cursor:pointer;align-items:flex-start;min-width:0}
.hr-c:hover{background:var(--soft)}
.hr.cur .hr-l{color:var(--tq-d)}
.appt{border-radius:12px;padding:8px 12px;min-width:180px;max-width:100%;border-left:4px solid var(--tq);background:var(--tq-l);cursor:pointer}
.appt b{display:block;font-size:14.5px}
.appt small{font-size:12.5px;color:var(--muted)}
.appt.tugadi{border-color:var(--green);background:var(--green-l)}
.appt.kelmadi,.appt.bekor{border-color:var(--red);background:var(--red-l);opacity:.75}
.appt.keldi{border-color:var(--tq-d);box-shadow:0 0 0 2px var(--tq-glow)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td.r,th.r{text-align:right}

/* client profile */
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.prof .ava{width:64px;height:64px;font-size:24px}
.prof h2{font-size:28px;font-weight:800;letter-spacing:-.04em}
.visit{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:16px}
.visit:first-child{border-top:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;background:var(--soft);padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .k{position:absolute;left:4px;top:4px;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:1px 6px;background:rgba(0,0,0,.6);color:#fff}
.th .k.keyin{background:var(--tq-d)}
.th.sel{border-color:var(--tq);box-shadow:0 0 0 3px var(--tq-glow)}
.th.sel::after{content:"✓";position:absolute;right:4px;bottom:3px;background:var(--tq);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.add-ph{width:96px;height:72px;border-radius:10px;border:2px dashed color-mix(in srgb,var(--tq) 60%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tq-d);font-size:11.5px;font-weight:700;cursor:pointer}
.add-ph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* compare */
.cmp{position:relative;width:min(100%,calc(60vh * 4 / 3));margin-inline:auto;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:#000;--p:50%;user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .b{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p))}
.cmp .h{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 14px rgba(0,193,192,.9)}
.cmp .h::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#00C1C0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.cmp .lb{position:absolute;top:12px;font-size:12px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:8px;color:#fff;background:rgba(0,0,0,.55)}
.cmp .lb.l{left:12px} .cmp .lb.r{right:12px;background:#007D79}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbs figure{margin:0;display:flex;flex-direction:column;gap:6px}
.sbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--soft)}
.sbs figcaption{font-size:13px;font-weight:700}

/* reminders */
.rem{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .ph{font-size:18px;font-weight:800;letter-spacing:-.02em;user-select:all}
.sms{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13.5px;color:var(--ink);user-select:all}
.rem .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}

/* bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:200px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--tq);min-height:3px}
.bar.today i{background:var(--tq-d);box-shadow:0 0 14px var(--tq-glow)}
.bar small{font-size:12px;color:var(--muted);font-weight:600}
.bar em{font-style:normal;font-size:11.5px;font-weight:700}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
.mback{position:absolute;inset:0;background:rgba(5,25,25,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.msheet{position:relative;background:var(--card);border-radius:20px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .22s ease-out}
.msheet.wide{width:min(940px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.mh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.mh h3{font-size:22px;font-weight:800;letter-spacing:-.03em}
.mh .x{margin-left:auto}
.mb{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.mf .l{margin-right:auto}
.box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* due alert */
.due{text-align:center;padding:30px 24px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--tq-l);color:var(--tq-d);position:relative}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--tq);animation:ring 1.6s ease-out infinite}
.ring::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.due h2{font-size:30px;font-weight:800;letter-spacing:-.045em}

/* toasts */
#toasts{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:#123232;color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:380px;border-left:4px solid #00C1C0;animation:pop .2s ease-out}
.toast.err{border-color:#ff5a6e} .toast.warn{border-color:#f0b440}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 20% 10%,#00C1C0 0%,#00908e 45%,#005c59 100%)}
.login-brand .logo b{font-size:44px} .login-brand .logo span{color:rgba(255,255,255,.8);font-size:12px}
.login-brand .logo i{background:#fff;box-shadow:0 0 18px rgba(255,255,255,.8);width:80px}
.login-brand h2{font-size:38px;font-weight:800;letter-spacing:-.05em;max-width:440px;line-height:1.05}
.login-brand h2 em{font-style:normal;text-shadow:0 0 24px rgba(255,255,255,.6)}
.login-brand ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px;font-weight:600;opacity:.95}
.login-brand li::before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);margin-right:10px;font-size:12px}
.trail{position:absolute;right:-80px;bottom:-80px;width:420px;height:420px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 30px rgba(255,255,255,.3),inset 0 0 30px rgba(255,255,255,.2)}
.login-form{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:48px max(32px,env(safe-area-inset-right,0px)) 48px 48px;max-width:520px;width:100%;margin:0 auto}
.login-form h1{font-size:32px;font-weight:800;letter-spacing:-.045em}
.err{color:var(--red);font-weight:600;background:var(--red-l);padding:10px 12px;border-radius:10px}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.demo b{color:var(--ink)}

/* phone */
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 2px;position:relative;min-width:0}
  .tabbar button.on{color:var(--tq-d)}
  .tabbar .badge{position:absolute;top:2px;left:55%;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:100px}
  .two{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .login{grid-template-columns:1fr}
  .login-brand{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));min-height:300px}
  .login-form{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .focus{grid-template-columns:1fr}
  .focus .acts{flex-direction:row;flex-wrap:wrap}
  .mob-hide{display:none}
  .tabbar-out{display:inline-flex!important}
  #toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .top h1{font-size:21px}
}
@media (max-width:560px){
  .grid2,.grid3,.pcols{grid-template-columns:1fr}
  .prof{grid-template-columns:auto 1fr}
  .prof .acts{grid-column:1/-1}
  .visit{grid-template-columns:1fr}
  .rem{grid-template-columns:1fr}
  .rem .acts{flex-direction:row;flex-wrap:wrap}
  .focus h2{font-size:28px}
  .tl-row{grid-template-columns:58px 1fr;}
  .tl-row .pill{grid-column:2}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================
   PODO MASTER — pedolog CRM (oflayn, planshet uchun)
   Ma’lumotlar: localStorage (matn) + IndexedDB (rasmlar)
   ========================================================= */
const LS_KEY = "podo_crm_v1";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (ds, n) => { const d = new Date(ds + "T00:00"); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 864e5);
const MON = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
const WD = ["yakshanba", "dushanba", "seshanba", "chorshanba", "payshanba", "juma", "shanba"];
const fmtD = ds => { const d = new Date(ds + "T00:00"); return `${d.getDate()}-${MON[d.getMonth()]}`; };
const fmtDY = ds => { const d = new Date(ds + "T00:00"); return `${d.getDate()}-${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDL = ds => { const d = new Date(ds + "T00:00"); return `${d.getDate()}-${MON[d.getMonth()]}, ${WD[d.getDay()]}`; };
const hm = ts => { if (!ts) return "—"; const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const money = n => String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so‘m";
const durTxt = ms => { if (!ms || ms < 0) return "—"; const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} soat ${m % 60} daq` : `${m} daq`; };
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const tsOf = (date, time) => new Date(`${date}T${time || "00:00"}`).getTime();
const minsUntil = a => (tsOf(a.date, a.time) - Date.now()) / 60000;
const byTime = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);

const ROLE = { admin: "Administrator", reception: "Resepshn" };
const PAY = { naqd: "Naqd", karta: "Karta", click: "Click / Payme" };
const ST = { kutilmoqda: ["Yozilgan", "s-wait"], keldi: ["Muolajada", "s-in"], tugadi: ["Ketdi", "s-done"], kelmadi: ["Kelmadi", "s-no"], bekor: ["Bekor qilindi", "s-cancel"] };
const DIAG = ["Tirnoq o‘sib kirishi", "Zamburug‘ (onixomikoz)", "Qadoq / natoptish", "Tovon yorilishi", "So‘gal", "Qandli diabet", "Yassi oyoqlik", "Gipergidroz", "Allergiya"];
const WARN_DIAG = ["Qandli diabet", "Allergiya"];

/* ---------- icons ---------- */
const I = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  bell: '<path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  shift: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A17 17 0 013 5a2 2 0 012-2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>',
  compare: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 3v18"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  foot: '<path d="M9 21c-2.6 0-3.8-2-3.3-5.2.4-2.6 1.8-4.6 1.8-7.6 0-2.8 1.2-5.2 3.8-5.2s3.4 2.4 3 5.4c-.3 2.6-.9 4 .2 6.4 1.3 2.8.7 6.2-5.5 6.2z"/><circle cx="17.6" cy="5" r="1.3"/><circle cx="19.8" cy="8.4" r="1.1"/><circle cx="20.5" cy="12" r="1"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ""}</svg>`;

/* ---------- server API ---------- */
let S = null, CU = null, V = { name: "bugun", p: {} }, lastAct = Date.now();
const NOTIFIED = new Set();
let NET_OK = true, STALE = false;
async function api(method, url, body) {
  const opt = { method, headers: { "X-Podo": "1" }, credentials: "same-origin", cache: "no-store" };
  if (body instanceof Blob) { opt.body = body; opt.headers["Content-Type"] = body.type || "application/octet-stream"; }
  else if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  let r;
  try { r = await fetch(url, opt); } catch (e) { setNet(false); throw new Error("Server bilan aloqa yo‘q. Internetni tekshiring."); }
  setNet(true);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== "/api/login") { if (CU) { CU = null; mclose(); render(); toast("Sessiya tugadi, qayta kiring", "warn"); } throw new Error(j.error || "Tizimga qayta kiring"); }
  if (!r.ok) throw new Error(j.error || "Server xatosi (" + r.status + ")");
  return j;
}
function setNet(ok) {
  if (ok === NET_OK) return; NET_OK = ok;
  const el = $("#net"); if (el) { el.className = "net " + (ok ? "on" : "off"); el.querySelector("span").textContent = ok ? "Onlayn" : "Aloqa yo‘q"; }
  toast(ok ? "Server bilan aloqa tiklandi" : "Server bilan aloqa uzildi", ok ? "" : "err");
}
function applyState(st) { S = st || {}; S.settings = S.settings || {}; ["users", "services", "clients", "appts", "photos", "reminders", "shifts"].forEach(k => S[k] = S[k] || []); }
async function refresh() { try { applyState(await api("GET", "/api/state")); safeRender(); } catch (e) { } }
function busy() { const ae = document.activeElement; return !!ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !["button", "submit", "checkbox", "radio", "file", "range"].includes(ae.type); }
function safeRender() {
  if (!CU) return;
  if (busy()) { STALE = true; return; }
  STALE = false;
  const m = $("#modal"), sheet = $(".msheet", m), top = sheet ? sheet.scrollTop : 0;
  render();
  if (!m.hidden && MODAL_CTX && MODAL_CTX.type === "visit") { openVisit(MODAL_CTX.id); const s2 = $(".msheet", m); if (s2) s2.scrollTop = top; }
}
/* the local change is already applied; send it, then resync with the server */
function persist(p, okMsg) { return p.then(r => { if (okMsg) toast(okMsg); return refresh().then(() => r || true); }).catch(e => { toast(e.message, "err"); refresh(); return null; }); }
const putDoc = (coll, doc) => api("PUT", `/api/${coll}/${encodeURIComponent(doc.id)}`, doc);
const delDoc = (coll, id) => api("DELETE", `/api/${coll}/${encodeURIComponent(id)}`);
const phURL = id => "/api/photos/" + encodeURIComponent(id);
function hydrate(root = document) { $$("img[data-ph]", root).forEach(img => { if (!img.getAttribute("src")) img.src = phURL(img.dataset.ph); }); }
const DEB = new Map();
function debouncePut(a) { const x = DEB.get(a.id); if (x) clearTimeout(x.t); DEB.set(a.id, { a, t: setTimeout(() => { DEB.delete(a.id); persist(putDoc("appts", a)); }, 700) }); }
function flushDebounce(send) { for (const [, x] of DEB) { clearTimeout(x.t); if (send) persist(putDoc("appts", x.a)); } DEB.clear(); }

/* ---------- helpers on data ---------- */
const cli = id => S.clients.find(c => c.id === id) || { name: "O‘chirilgan mijoz", phone: "", diag: [] };
const svc = id => S.services.find(s => s.id === id) || { name: "—", price: 0, dur: 30 };
const usr = id => S.users.find(u => u.id === id) || { name: "—" };
const openShift = () => S.shifts.find(s => !s.closedAt);
const apptsOn = d => S.appts.filter(a => a.date === d).sort(byTime);
const clientVisits = cid => S.appts.filter(a => a.clientId === cid && a.status === "tugadi").sort(byTime).reverse();
const lastVisit = (cid, exceptId) => clientVisits(cid).find(a => a.id !== exceptId);
const apptPhotos = aid => S.photos.filter(p => p.apptId === aid).sort((a, b) => a.ts - b.ts);
const dueReminders = () => S.reminders.filter(r => !r.done && r.date <= today()).sort((a, b) => a.date.localeCompare(b.date));
const isAdmin = () => CU && CU.role === "admin";
function smsText(r) {
  const c = cli(r.clientId), a = S.appts.find(x => x.id === r.apptId);
  const days = a ? diffDays(a.date, today()) : "";
  return S.settings.sms.replace(/\{ism\}/g, c.name.split(" ")[0]).replace(/\{kun\}/g, days).replace(/\{tel\}/g, S.settings.phone).replace(/\{sabab\}/g, r.reason || "");
}
function shiftTotals(sh) {
  const from = sh.openedAt, to = sh.closedAt || Date.now();
  const list = S.appts.filter(a => a.status === "tugadi" && a.leftAt >= from && a.leftAt <= to);
  const t = { count: list.length, naqd: 0, karta: 0, click: 0, total: 0, list };
  list.forEach(a => { t[a.pay] = (t[a.pay] || 0) + (+a.price || 0); t.total += +a.price || 0; });
  t.noshow = S.appts.filter(a => a.status === "kelmadi" && tsOf(a.date, a.time) >= from && tsOf(a.date, a.time) <= to).length;
  return t;
}

/* ---------- UI helpers ---------- */
function toast(msg, kind = "") { const el = document.createElement("div"); el.className = "toast " + kind; el.textContent = msg; $("#toasts").appendChild(el); setTimeout(() => el.remove(), 4200); }
function modal(html, wide, locked) { MODAL_CTX = null; const m = $("#modal"); m.innerHTML = `<div class="mback" ${locked ? "" : 'data-act="mclose"'}></div><div class="msheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; hydrate(m); }
function mclose() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
const mhead = (title, sub = "") => `<div class="mh"><div><h3>${title}</h3>${sub ? `<div class="muted" style="margin-top:2px">${sub}</div>` : ""}</div><button class="btn ghost sm x" data-act="mclose" aria-label="Yopish">${ic("x")}</button></div>`;
function confirmBox(text, onYes, yesLabel = "Ha, tasdiqlayman", danger = true) {
  CONFIRM = onYes;
  modal(`${mhead("Tasdiqlang")}<div class="mb"><p style="margin:0;font-size:16px">${text}</p></div><div class="mf"><button class="btn" data-act="mclose">Bekor qilish</button><button class="btn ${danger ? "danger fill" : "pri"}" data-act="confirmYes">${yesLabel}</button></div>`);
}
let CONFIRM = null;
function copyText(t) {
  const done = () => toast("Nusxa olindi");
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t)); } catch (e) { fallbackCopy(t); }
}
function fallbackCopy(t) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Nusxa olindi"); } catch (e) { toast("Matnni belgilab, qo‘lda nusxa oling", "warn"); } ta.remove(); }
function beep() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .22].forEach((d, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = i ? 1320 : 880; o.type = "sine"; g.gain.setValueAtTime(0, ac.currentTime + d); g.gain.linearRampToValueAtTime(.2, ac.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d + .5); o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .55); }); } catch (e) { }
}
const statusPill = s => `<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
const diagTags = (d = []) => d.map(x => `<span class="tag ${WARN_DIAG.includes(x) ? "warn" : ""}">${WARN_DIAG.includes(x) ? "⚠ " : ""}${esc(x)}</span>`).join(" ");

/* ---------- permissions ---------- */
const NAV = [
  { id: "bugun", label: "Bugun", icon: "home" },
  { id: "jadval", label: "Jadval", icon: "cal" },
  { id: "mijozlar", label: "Mijozlar", icon: "users" },
  { id: "eslatmalar", label: "Eslatmalar", icon: "bell" },
  { id: "hisobot", label: "Hisobot", icon: "chart" },
  { id: "smena", label: "Smena", icon: "shift" },
  { id: "sozlamalar", label: "Sozlamalar", icon: "gear", admin: true }
];
const TITLES = { bugun: "Bugun", jadval: "Qabul jadvali", mijozlar: "Mijozlar bazasi", mijoz: "Mijoz kartasi", eslatmalar: "Eslatmalar", hisobot: "Kunlik hisobot", smena: "Smena", sozlamalar: "Sozlamalar" };

/* ---------- auth ---------- */
async function login(l, p) {
  try { const r = await api("POST", "/api/login", { login: l.trim(), password: p }); afterLogin(r); return ""; }
  catch (e) { return e.message; }
}
function afterLogin(r) {
  CU = r.me; applyState(r.state); lastAct = Date.now(); V = { name: "bugun", p: {} }; render();
  if (CU.mustChange) return passModal(true);
  const n = dueReminders().length; if (n) setTimeout(() => toast(`Bugun ${n} ta eslatma: mijozlarga qo‘ng‘iroq qiling`, "warn"), 600);
  if (!openShift()) setTimeout(() => toast("Smena ochilmagan. Ishni boshlashdan oldin smenani oching.", "warn"), 900);
}
async function logout(msg) { flushDebounce(true); try { await api("POST", "/api/logout"); } catch (e) { } CU = null; S = null; mclose(); render(); if (msg) toast(msg); }
function passModal(forced) {
  modal(`${forced ? `<div class="mh"><div><h3>Parolni almashtiring</h3><div class="muted" style="margin-top:2px">Xavfsizlik uchun standart parolni o‘zingizniki bilan almashtiring.</div></div></div>` : mhead("Parolni o‘zgartirish", esc(CU.name))}
  <form id="passForm"><div class="mb">
    <label class="f">Joriy parol<input id="pw_old" type="password" autocomplete="current-password" required></label>
    <div class="grid2"><label class="f">Yangi parol (kamida 6 belgi)<input id="pw_new" type="password" autocomplete="new-password" minlength="6" required></label>
    <label class="f">Yangi parolni takrorlang<input id="pw_new2" type="password" autocomplete="new-password" minlength="6" required></label></div>
    <div id="pw_err" class="err" hidden></div>
  </div><div class="mf">${forced ? `<button type="button" class="btn l" data-act="logout">Chiqish</button>` : `<button type="button" class="btn" data-act="mclose">Bekor qilish</button>`}<button class="btn pri big" type="submit">Saqlash</button></div></form>`, false, forced);
}

/* ---------- render ---------- */
function go(name, p = {}) { if (name === "sozlamalar" && !isAdmin()) return toast("Bu bo‘lim faqat administrator uchun", "err"); V = { name, p }; render(); window.scrollTo(0, 0); }
function render() {
  if (!CU) return renderLogin();
  const due = dueReminders().length, sh = openShift();
  const nav = NAV.filter(n => !n.admin || isAdmin());
  const active = V.name === "mijoz" ? "mijozlar" : V.name;
  const btn = (n, cls) => `<button class="${active === n.id ? "on" : ""}" data-act="go" data-v="${n.id}" ${active === n.id ? 'aria-current="page"' : ""}>${ic(n.icon, cls ? 22 : 21)}<span>${n.label}</span>${n.id === "eslatmalar" && due ? `<span class="badge">${due}</span>` : ""}</button>`;
  const now = new Date();
  $("#app").innerHTML = `<div class="shell">
  <aside class="rail">

    <div class="rail-foot">
      <div id="net" class="net ${NET_OK ? "on" : "off"}" style="padding:0 10px"><span>${NET_OK ? "Onlayn" : "Aloqa yo‘q"}</span></div>

      <div class="row" style="flex-wrap:nowrap"><button class="btn sm grow" data-act="passModal">${ic("lock", 16)} Parol</button><button class="btn sm grow" data-act="logout">${ic("out", 16)} Chiqish</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1>${TITLES[V.name] || ""}</h1>
      <button class="pill ${sh ? "s-done" : "s-no"}" style="border:0;cursor:pointer;min-height:34px" data-act="go" data-v="smena">${ic("shift", 15)} ${sh ? "Smena ochiq · " + hm(sh.openedAt) : "Smena yopiq"}</button>
      <div class="clock num"><b id="clk">${pad(now.getHours())}:${pad(now.getMinutes())}</b><small>${fmtDL(today())}</small></div>
      <button class="btn pri" data-act="newAppt">${ic("plus", 18)} <span class="mob-hide">Yangi yozuv</span></button>
      <button class="btn sm ghost tabbar-out" data-act="logout" aria-label="Chiqish" style="display:none">${ic("out", 18)}</button>
    </header>
    <div class="content" id="view">${VIEWS[V.name] ? VIEWS[V.name]() : ""}</div>
  </main>
  <nav class="tabbar">${nav.filter(n => n.id !== "sozlamalar").map(n => btn(n, 1)).join("")}${isAdmin() ? btn(NAV[6], 1) : `<button data-act="logout">${ic("out", 22)}<span>Chiqish</span></button>`}</nav>
  </div>`;
  hydrate();
}

/* ===================== VIEWS ===================== */
const VIEWS = {};

VIEWS.bugun = () => {
  const t = today(), list = apptsOn(t).filter(a => a.status !== "bekor"), sh = openShift();
  const cur = list.find(a => a.status === "keldi");
  const next = list.filter(a => a.status === "kutilmoqda").find(a => minsUntil(a) > -90);
  const focus = cur || next;
  const cnt = s => list.filter(a => a.status === s).length;
  const due = dueReminders();
  let focusHtml = "";
  if (focus) {
    const c = cli(focus.clientId), s = svc(focus.serviceId), lv = lastVisit(c.id, focus.id);
    const lp = lv ? apptPhotos(lv.id).filter(p => p.kind === "keyin").pop() : null;
    let when;
    if (focus.status === "keldi") when = `<span class="count">Muolajada · ${durTxt(Date.now() - focus.arrivedAt)}</span>`;
    else { const m = Math.round(minsUntil(focus)); when = m > 0 ? `<span class="count">${m >= 60 ? Math.floor(m / 60) + " soat " + (m % 60) + " daq" : m + " daqiqadan keyin"}</span>` : m > -3 ? `<span class="count late">Vaqti keldi!</span>` : `<span class="count late">${-m} daq kechikmoqda</span>`; }
    focusHtml = `<section class="card focus">
      <div style="position:relative;z-index:1;min-width:0">
        <div class="eyebrow">${focus.status === "keldi" ? "Hozir muolajada" : "Navbatdagi mijoz"} · ${focus.time}</div>
        <h2>${esc(c.name)}</h2>
        <div class="meta"><span>${ic("foot", 18)} ${esc(s.name)}</span><span class="num">${ic("phone", 17)} ${esc(c.phone)}</span>${when}</div>
        ${c.diag && c.diag.length ? `<div class="row" style="margin-top:12px">${diagTags(c.diag)}</div>` : ""}
        ${lv ? `<div class="last row" style="align-items:flex-start;flex-wrap:nowrap">${lp ? `<img class="focus-thumb" data-ph="${lp.id}" alt="">` : ""}<div><b>Oxirgi tashrif · ${fmtD(lv.date)}</b> — ${esc(svc(lv.serviceId).name)}<br>${esc(lv.notes || "Izoh yo‘q")}</div></div>` : `<div class="last">Birinchi tashrif</div>`}
      </div>
      <div class="acts">
        ${focus.status === "keldi" ? `<button class="btn pri big" data-act="visit" data-id="${focus.id}">${ic("foot")} Muolajani ochish</button>` : `<button class="btn pri big" data-act="arrive" data-id="${focus.id}">${ic("check")} Keldi</button>`}
        <button class="btn" data-act="client" data-id="${c.id}">Mijoz kartasi</button>
      </div></section>`;
  } else focusHtml = `<section class="card pad"><div class="empty">${ic("cal", 32)}<p>Bugun navbatda boshqa mijoz yo‘q.</p><button class="btn pri" data-act="newAppt">${ic("plus", 18)} Yangi yozuv</button></div></section>`;

  return `${!sh ? `<div class="banner">${ic("shift")} Smena ochilmagan — mijozlarni qabul qilish uchun avval smenani oching.<button class="btn pri" data-act="openShiftModal">Smenani ochish</button></div>` : ""}
  ${focusHtml}
  <section class="stats">
    <div class="card stat"><b class="num">${list.length}</b><span>Bugun yozilgan</span></div>
    <div class="card stat hl"><b class="num">${cnt("keldi") + cnt("tugadi")}</b><span>Keldi</span></div>
    <div class="card stat"><b class="num">${cnt("tugadi")}</b><span>Ketdi</span></div>
    <div class="card stat"><b class="num" style="color:var(--red)">${cnt("kelmadi")}</b><span>Kelmadi</span></div>
    <div class="card stat"><b class="num" style="color:var(--amber)">${due.length}</b><span>Eslatma (bugun)</span></div>
  </section>
  <div class="two">
    <section class="card">
      <div class="sec-h pad" style="padding-bottom:8px"><h2>Bugungi qabul</h2><button class="btn sm" data-act="go" data-v="jadval">Jadvalni ochish</button></div>
      <div class="tl">${list.length ? list.map(a => { const c = cli(a.clientId); const isNow = focus && a.id === focus.id; return `<div class="tl-row ${isNow ? "now" : ""}" data-act="visit" data-id="${a.id}"><div class="tl-time num">${a.time}</div><div style="min-width:0"><div class="tl-name">${esc(c.name)}</div><div class="tl-sub">${esc(svc(a.serviceId).name)}${a.arrivedAt ? ` · keldi ${hm(a.arrivedAt)}` : ""}${a.leftAt ? ` · ketdi ${hm(a.leftAt)}` : ""}</div></div>${statusPill(a.status)}</div>`; }).join("") : `<div class="empty">Bugunga yozuv yo‘q</div>`}</div>
    </section>
    <section class="card">
      <div class="sec-h pad" style="padding-bottom:8px"><h2>Qo‘ng‘iroq qilish kerak</h2><button class="btn sm" data-act="go" data-v="eslatmalar">Barchasi</button></div>
      <div class="tl">${due.length ? due.slice(0, 5).map(r => { const c = cli(r.clientId); const late = diffDays(r.date, today()); return `<div class="tl-row" style="grid-template-columns:1fr auto" data-act="go" data-v="eslatmalar"><div style="min-width:0"><div class="tl-name">${esc(c.name)}</div><div class="tl-sub num">${esc(c.phone)} · ${esc(r.reason)}</div></div><span class="pill ${late ? "s-no" : "s-in"}">${late ? late + " kun o‘tdi" : "Bugun"}</span></div>`; }).join("") : `<div class="empty">${ic("check", 28)}<p>Bugungi eslatmalar bajarilgan</p></div>`}</div>
    </section>
  </div>`;
};

VIEWS.jadval = () => {
  const d = V.p.date || today(); const list = apptsOn(d);
  const hours = []; for (let h = 8; h <= 21; h++) hours.push(h);
  const nh = new Date().getHours();
  const extra = list.filter(a => +a.time.slice(0, 2) < 8 || +a.time.slice(0, 2) > 21);
  return `<section class="row">
    <button class="btn" data-act="day" data-v="-1" aria-label="Oldingi kun">${ic("left")}</button>
    <button class="btn ${d === today() ? "pri" : ""}" data-act="day" data-v="0">Bugun</button>
    <button class="btn" data-act="day" data-v="1" aria-label="Keyingi kun">${ic("right")}</button>
    <input type="date" class="inp" id="jdate" value="${d}" style="width:auto">
    <h2 style="font-size:20px;font-weight:800;margin-left:6px">${fmtDL(d)}</h2>
    <span class="muted" style="margin-left:auto">${list.filter(a => a.status !== "bekor").length} ta yozuv</span>
  </section>
  <section class="card sched">
    ${extra.length ? `<div class="hr"><div class="hr-l">Boshqa</div><div class="hr-c">${extra.map(apptChip).join("")}</div></div>` : ""}
    ${hours.map(h => { const items = list.filter(a => +a.time.slice(0, 2) === h); return `<div class="hr ${d === today() && h === nh ? "cur" : ""}"><div class="hr-l num">${pad(h)}:00</div><div class="hr-c" data-act="newAppt" data-date="${d}" data-time="${pad(h)}:00">${items.map(apptChip).join("")}</div></div>`; }).join("")}
  </section>`;
};
function apptChip(a) { const c = cli(a.clientId); return `<div class="appt ${a.status}" data-act="visit" data-id="${a.id}"><b>${a.time} · ${esc(c.name)}</b><small>${esc(svc(a.serviceId).name)} · ${ST[a.status][0]}</small></div>`; }

VIEWS.mijozlar = () => {
  return `<section class="row">
    <label class="search"><span hidden>Qidirish</span>${ic("search", 20)}<input class="inp" id="q" type="search" placeholder="Ism yoki telefon raqami bo‘yicha qidirish" value="${esc(V.p.q || "")}"></label>
    <button class="btn pri" data-act="newClient">${ic("plus", 18)} Yangi mijoz</button>
  </section>
  <section class="card"><div class="tbl-wrap" id="clist">${clientTable()}</div></section>`;
};
function clientTable() {
  const q = (V.p.q || "").toLowerCase().replace(/\s+/g, "");
  const rows = S.clients.filter(c => !q || c.name.toLowerCase().replace(/\s+/g, "").includes(q) || c.phone.replace(/\D/g, "").includes(q.replace(/\D/g, "") || "§"))
    .map(c => ({ c, lv: clientVisits(c.id)[0], n: clientVisits(c.id).length, r: S.reminders.filter(r => r.clientId === c.id && !r.done).sort((a, b) => a.date.localeCompare(b.date))[0] }))
    .sort((a, b) => ((b.lv && b.lv.date) || "").localeCompare((a.lv && a.lv.date) || "") || a.c.name.localeCompare(b.c.name));
  if (!rows.length) return `<div class="empty">Mijoz topilmadi. <button class="btn sm pri" data-act="newClient">Yangi mijoz qo‘shish</button></div>`;
  return `<table><thead><tr><th>Mijoz</th><th>Telefon</th><th>Tashxis</th><th class="r">Tashriflar</th><th>Oxirgi tashrif</th><th>Eslatma</th></tr></thead><tbody>
  ${rows.map(({ c, lv, n, r }) => `<tr class="click" data-act="client" data-id="${c.id}"><td><b>${esc(c.name)}</b>${c.demo ? ` <span class="muted" style="font-size:11px">namuna</span>` : ""}</td><td class="num" style="white-space:nowrap">${esc(c.phone)}</td><td>${diagTags((c.diag || []).slice(0, 2))}</td><td class="r num">${n}</td><td class="num" style="white-space:nowrap">${lv ? fmtDY(lv.date) : "—"}</td><td style="white-space:nowrap">${r ? `<span class="pill ${r.date <= today() ? "s-no" : "s-in"}">${fmtD(r.date)}</span>` : "—"}</td></tr>`).join("")}
  </tbody></table>`;
}

VIEWS.mijoz = () => {
  const c = S.clients.find(x => x.id === V.p.id); if (!c) return `<div class="empty">Mijoz topilmadi</div>`;
  const visits = S.appts.filter(a => a.clientId === c.id).sort(byTime).reverse();
  const done = visits.filter(a => a.status === "tugadi");
  const photos = S.photos.filter(p => p.clientId === c.id).sort((a, b) => a.ts - b.ts);
  const rems = S.reminders.filter(r => r.clientId === c.id).sort((a, b) => b.date.localeCompare(a.date));
  const sel = V.p.sel || [];
  const age = c.birth ? Math.floor(diffDays(c.birth, today()) / 365.25) : null;
  const spent = done.reduce((s, a) => s + (+a.price || 0), 0);
  return `<button class="btn sm ghost" data-act="go" data-v="mijozlar" style="align-self:flex-start">${ic("left", 18)} Mijozlar</button>
  <section class="card pad prof">
    <div class="ava">${esc(initials(c.name))}</div>
    <div style="min-width:0"><h2>${esc(c.name)}</h2>
      <div class="row muted" style="margin-top:4px"><span class="num" style="font-weight:700;color:var(--ink);font-size:17px;user-select:all">${esc(c.phone)}</span><button class="btn sm ghost" data-act="copy" data-v="${esc(c.phone)}">${ic("copy", 16)} Nusxa</button>${age !== null ? `<span>${age} yosh</span>` : ""}<span>Mijoz: ${fmtDY(dstr(new Date(c.createdAt)))} dan</span></div>
      ${c.diag && c.diag.length ? `<div class="row" style="margin-top:10px">${diagTags(c.diag)}</div>` : ""}
      ${c.notes ? `<div class="box" style="margin-top:12px">${esc(c.notes)}</div>` : ""}
    </div>
    <div class="acts row" style="flex-direction:column;align-items:stretch">
      <button class="btn pri" data-act="newAppt" data-client="${c.id}">${ic("cal", 18)} Navbatga yozish</button>
      <button class="btn" data-act="newRem" data-client="${c.id}">${ic("bell", 18)} Eslatma qo‘shish</button>
      <button class="btn" data-act="editClient" data-id="${c.id}">${ic("edit", 18)} Tahrirlash</button>
      ${isAdmin() ? `<button class="btn danger" data-act="delClient" data-id="${c.id}">${ic("trash", 18)} O‘chirish</button>` : ""}
    </div>
  </section>
  <section class="stats" style="grid-template-columns:repeat(${isAdmin() ? 4 : 3},1fr)">
    <div class="card stat hl"><b class="num">${done.length}</b><span>Tashriflar</span></div>
    <div class="card stat"><b class="num">${photos.length}</b><span>Rasmlar</span></div>
    <div class="card stat"><b class="num" style="font-size:22px">${done[0] ? fmtD(done[0].date) : "—"}</b><span>Oxirgi tashrif</span></div>
    ${isAdmin() ? `<div class="card stat"><b class="num" style="font-size:22px">${money(spent)}</b><span>Jami to‘lov</span></div>` : ""}
  </section>
  <section class="card">
    <div class="sec-h pad" style="padding-bottom:6px"><h2>Oldin / keyin rasmlar</h2>
      ${photos.length >= 2 ? `<button class="btn sm" data-act="cmpFirstLast" data-id="${c.id}">${ic("compare", 16)} Birinchi va oxirgi</button>` : ""}
      <button class="btn sm ${sel.length === 2 ? "pri" : ""}" data-act="cmpSel" ${sel.length === 2 ? "" : "disabled"}>${ic("compare", 16)} Tanlanganlarni solishtirish (${sel.length}/2)</button>
    </div>
    <div class="pad" style="padding-top:6px">${photos.length ? `<p class="muted" style="margin:0 0 6px">Ikkita rasmni belgilang — davolanish natijasini yonma-yon ko‘rasiz.</p><div class="thumbs">${photos.map(p => `<button class="th ${sel.includes(p.id) ? "sel" : ""}" data-act="pick" data-id="${p.id}" aria-pressed="${sel.includes(p.id)}"><img data-ph="${p.id}" alt="${p.kind} ${p.date}"><span class="k ${p.kind}">${p.kind.toUpperCase()} · ${fmtD(p.date)}</span></button>`).join("")}</div>` : `<div class="empty">Hali rasm yo‘q. Rasmlar muolaja oynasida “Oldin” va “Keyin” bo‘limlaridan qo‘shiladi.</div>`}</div>
  </section>
  <div class="two">
  <section class="card"><div class="sec-h pad" style="padding-bottom:6px"><h2>Tashriflar tarixi</h2></div>
    ${visits.length ? visits.map(a => { const ph = apptPhotos(a.id); return `<div class="visit"><div><b class="num">${fmtDY(a.date)}</b><div class="muted num">${a.time}</div><div style="margin-top:6px">${statusPill(a.status)}</div></div><div style="min-width:0"><div class="row"><b class="grow">${esc(svc(a.serviceId).name)}</b>${a.status === "tugadi" && isAdmin() ? `<span class="num muted">${money(a.price)}</span>` : ""}<button class="btn sm" data-act="visit" data-id="${a.id}">Ochish</button></div>${a.arrivedAt ? `<div class="muted num" style="font-size:13px">Keldi ${hm(a.arrivedAt)} · Ketdi ${hm(a.leftAt)} · ${durTxt(a.leftAt - a.arrivedAt)}</div>` : ""}${a.notes ? `<div style="margin-top:6px">${esc(a.notes)}</div>` : ""}${ph.length ? `<div class="thumbs">${ph.map(p => `<button class="th" data-act="cmpVisit" data-id="${a.id}"><img data-ph="${p.id}" alt=""><span class="k ${p.kind}">${p.kind.toUpperCase()}</span></button>`).join("")}</div>` : ""}</div></div>`; }).join("") : `<div class="empty">Tashriflar yo‘q</div>`}
  </section>
  <section class="card"><div class="sec-h pad" style="padding-bottom:6px"><h2>Eslatmalar</h2></div>
    ${rems.length ? rems.map(r => `<div class="tl-row" style="grid-template-columns:1fr auto;cursor:default"><div><div class="tl-name num">${fmtDY(r.date)}</div><div class="tl-sub">${esc(r.reason)}</div></div>${r.done ? `<span class="pill s-done">Bajarildi</span>` : `<span class="pill ${r.date <= today() ? "s-no" : "s-in"}">${r.date <= today() ? "Qo‘ng‘iroq qiling" : "Kutilmoqda"}</span>`}</div>`).join("") : `<div class="empty">Eslatma yo‘q</div>`}
  </section></div>`;
};

VIEWS.eslatmalar = () => {
  const tab = V.p.tab || "due", t = today();
  const lists = { due: S.reminders.filter(r => !r.done && r.date <= t).sort((a, b) => a.date.localeCompare(b.date)), soon: S.reminders.filter(r => !r.done && r.date > t).sort((a, b) => a.date.localeCompare(b.date)), done: S.reminders.filter(r => r.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)) };
  const L = lists[tab];
  return `<section class="row">
    <div class="chips" role="tablist">
      <button class="chip ${tab === "due" ? "on" : ""}" data-act="remTab" data-v="due">Bugun va o‘tgan (${lists.due.length})</button>
      <button class="chip ${tab === "soon" ? "on" : ""}" data-act="remTab" data-v="soon">Kelgusi (${lists.soon.length})</button>
      <button class="chip ${tab === "done" ? "on" : ""}" data-act="remTab" data-v="done">Bajarilgan</button>
    </div>
    <button class="btn pri" data-act="newRem" style="margin-left:auto">${ic("plus", 18)} Eslatma</button>
  </section>
  <p class="muted" style="margin:-6px 0 0">Muolaja yakunlanganda tanlangan kun (masalan, 7 kun) o‘tgach, mijoz shu ro‘yxatga avtomatik tushadi. Telefon raqamini va tayyor SMS matnini nusxalab yuboring.</p>
  <section class="card">${L.length ? L.map(r => { const c = cli(r.clientId); const late = diffDays(r.date, t); return `<div class="rem"><div style="min-width:0">
      <div class="row"><b style="font-size:17px">${esc(c.name)}</b>${r.done ? `<span class="pill s-done">Bajarildi ${r.doneAt ? fmtD(dstr(new Date(r.doneAt))) : ""}</span>` : late > 0 ? `<span class="pill s-no">${late} kun o‘tib ketdi</span>` : late === 0 ? `<span class="pill s-in">Bugun</span>` : `<span class="pill s-wait">${fmtDL(r.date)} · ${-late} kundan keyin</span>`}</div>
      <div class="row" style="margin-top:4px"><span class="ph num">${esc(c.phone)}</span><button class="btn sm ghost" data-act="copy" data-v="${esc(c.phone)}">${ic("copy", 16)} Raqam</button></div>
      <div class="muted">${esc(r.reason)}</div>
      ${!r.done ? `<div class="sms">${esc(smsText(r))}</div>` : ""}
    </div><div class="acts">
      ${!r.done ? `<button class="btn sm" data-act="copySms" data-id="${r.id}">${ic("copy", 16)} SMS matni</button>
      <button class="btn sm ok" data-act="remDone" data-id="${r.id}">${ic("check", 16)} Bog‘lanildi</button>
      <button class="btn sm pri" data-act="newAppt" data-client="${c.id}" data-rem="${r.id}">${ic("cal", 16)} Navbatga yozish</button>
      <button class="btn sm" data-act="remSnooze" data-id="${r.id}">+3 kun keyinga</button>` : `<button class="btn sm" data-act="client" data-id="${c.id}">Mijoz kartasi</button>`}

      <div class="bars">${days.map((x, i) => `<div class="bar ${x === d ? "today" : ""}"><em class="num">${vals[i] ? Math.round(vals[i] / 1000) + "k" : ""}</em><i style="height:${Math.max(2, vals[i] / mx * 140)}px"></i><small>${new Date(x + "T00:00").getDate()} ${WD[new Date(x + "T00:00").getDay()].slice(0, 3)}</small></div>`).join("")}</div></section>

  }

    ${adm ? `<button class="btn" data-act="rday" data-v="-1" aria-label="Oldingi kun">${ic("left")}</button><input type="date" class="inp" id="rdate" value="${d}" style="width:auto"><button class="btn" data-act="rday" data-v="1" aria-label="Keyingi kun">${ic("right")}</button>` : `<span class="pill s-wait">${ic("lock", 14)} Resepshn faqat bugungi hisobotni ko‘radi</span>`}

  <section class="stats" style="grid-template-columns:repeat(${adm ? 5 : 4},1fr)">
    <div class="card stat"><b class="num">${list.length}</b><span>Yozilgan</span></div>
    <div class="card stat hl"><b class="num">${list.filter(a => a.arrivedAt).length}</b><span>Keldi</span></div>
    <div class="card stat"><b class="num">${done.length}</b><span>Ketdi (yakunlandi)</span></div>
    <div class="card stat"><b class="num" style="color:var(--red)">${list.filter(a => a.status === "kelmadi").length}</b><span>Kelmadi</span></div>
    ${adm ? `<div class="card stat"><b class="num" style="font-size:22px">${money(sum())}</b><span>Naqd ${money(sum("naqd"))} · Karta ${money(sum("karta"))} · Click ${money(sum("click"))}</span></div>` : ""}
  </section>
  ${chart}
  <section class="card"><div class="sec-h pad" style="padding-bottom:4px"><h2>Kimlar keldi, kimlar ketdi</h2></div><div class="tbl-wrap"><table>
    <thead><tr><th>Vaqt</th><th>Mijoz</th><th>Telefon</th><th>Muolaja</th><th>Keldi</th><th>Ketdi</th><th>Davomiyligi</th>${adm ? `<th class="r">Summa</th><th>To‘lov</th>` : ""}<th>Holat</th></tr></thead>
    <tbody>${list.length ? list.map(a => { const c = cli(a.clientId); return `<tr class="click" data-act="visit" data-id="${a.id}"><td class="num"><b>${a.time}</b></td><td><b>${esc(c.name)}</b></td><td class="num" style="white-space:nowrap">${esc(c.phone)}</td><td>${esc(svc(a.serviceId).name)}</td><td class="num">${hm(a.arrivedAt)}</td><td class="num">${hm(a.leftAt)}</td><td class="num">${a.leftAt ? durTxt(a.leftAt - a.arrivedAt) : a.arrivedAt ? "davom etmoqda" : "—"}</td>${adm ? `<td class="r num" style="white-space:nowrap">${a.status === "tugadi" ? money(a.price) : "—"}</td><td>${a.status === "tugadi" ? PAY[a.pay] : "—"}</td>` : ""}<td>${statusPill(a.status)}</td></tr>`; }).join("") : `<tr><td colspan="10"><div class="empty">Bu kunda yozuv yo‘q</div></td></tr>`}</tbody></table></div></section>`;

function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function applyTheme() { const m = localGet("podo_theme") || "auto"; if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); }

function openVisit(id) {
  const a = S.appts.find(x => x.id === id); if (!a) return;
  const c = cli(a.clientId), s = svc(a.serviceId), lv = lastVisit(c.id, a.id);
  const ph = apptPhotos(a.id), old = ph.filter(p => p.kind === "oldin"), nw = ph.filter(p => p.kind === "keyin");
  const editable = a.status === "keldi" || a.status === "tugadi";
  const phCol = (kind, arr) => `<div><div class="eyebrow" style="margin-bottom:6px">${kind === "oldin" ? "Oldin (muolajadan avval)" : "Keyin (muolajadan so‘ng)"}</div><div class="thumbs" style="margin-top:0">${arr.map(p => `<button class="th" data-act="viewPh" data-id="${p.id}"><img data-ph="${p.id}" alt=""><span class="k ${kind}">${hm(p.ts)}</span></button>`).join("")}${editable ? `<label class="add-ph">${ic("cam", 22)}Rasm olish<input type="file" accept="image/*" capture="environment" multiple data-photo="${kind}" data-appt="${a.id}"></label>` : ""}</div></div>`;
  const rd = a.remindDays ?? 14;
  modal(`${mhead(esc(c.name), `<span class="num">${fmtDL(a.date)} · ${a.time}</span> · <span class="num">${esc(c.phone)}</span> · ${statusPill(a.status)}`)}
  <div class="mb">
    ${(c.diag || []).length || c.notes ? `<div class="box">${diagTags(c.diag)}${c.notes ? `<div style="margin-top:${(c.diag || []).length ? 8 : 0}px">${esc(c.notes)}</div>` : ""}</div>` : ""}
    ${lv ? `<div class="box"><div class="eyebrow">Oxirgi tashrif · ${fmtDY(lv.date)}</div><b>${esc(svc(lv.serviceId).name)}</b><div>${esc(lv.notes || "Izoh yo‘q")}</div>${apptPhotos(lv.id).length ? `<div class="thumbs">${apptPhotos(lv.id).map(p => `<button class="th" data-act="viewPh" data-id="${p.id}"><img data-ph="${p.id}" alt=""><span class="k ${p.kind}">${p.kind.toUpperCase()}</span></button>`).join("")}</div>` : ""}</div>` : `<div class="box">Birinchi tashrif — mijoz kartasini to‘ldirishni unutmang.</div>`}
    <label class="f">Muolaja<select data-f="serviceId" data-id="${a.id}">${S.services.map(x => `<option value="${x.id}" ${x.id === a.serviceId ? "selected" : ""}>${esc(x.name)} — ${money(x.price)}</option>`).join("")}</select></label>
    ${editable ? `
    <div class="pcols">${phCol("oldin", old)}${phCol("keyin", nw)}</div>
    ${old.length && nw.length ? `<button class="btn" data-act="cmpVisit" data-id="${a.id}">${ic("compare", 18)} Oldin / keyin solishtirish</button>` : ""}
    <label class="f">Muolaja izohi (shifokor uchun)<textarea data-f="notes" data-id="${a.id}" placeholder="Nima qilindi, nimaga e’tibor berish kerak, uy parvarishi...">${esc(a.notes || "")}</textarea></label>
    <div class="grid2"><label class="f">Summa (so‘m)<input type="number" inputmode="numeric" min="0" step="1000" data-f="price" data-id="${a.id}" value="${a.price ?? s.price}"></label>
      <div class="f">To‘lov turi<div class="chips">${Object.entries(PAY).map(([k, v]) => `<button class="chip ${a.pay === k ? "on" : ""}" data-act="setf" data-id="${a.id}" data-f="pay" data-v="${k}">${v}</button>`).join("")}</div></div></div>
    <div class="f">Nazorat eslatmasi — necha kundan keyin mijozga qo‘ng‘iroq qilinadi?<div class="chips">${[0, 3, 7, 14, 21, 30].map(n => `<button class="chip ${rd === n ? "on" : ""}" data-act="setf" data-id="${a.id}" data-f="remindDays" data-v="${n}">${n ? n + " kun" : "Kerak emas"}</button>`).join("")}<input class="inp" type="number" min="1" max="365" placeholder="Boshqa" data-f="remindDays" data-id="${a.id}" style="width:110px;min-height:40px" value="${[0, 3, 7, 14, 21, 30].includes(rd) ? "" : rd}"></div>

  </div>`, true);
  MODAL_CTX = { type: "visit", id };
}

document.addEventListener("input", e => {
  lastAct = Date.now(); const t = e.target;
  if (t.id === "q") { V.p.q = t.value; $("#clist").innerHTML = clientTable(); return; }
  if (t.id === "af_q") { $("#af_client").innerHTML = clientOptions(t.value); const o = $("#af_client").options[0]; if (o) o.selected = true; return; }

    const a = findA(t.dataset.id); if (!a) return;
    if (t.dataset.f === "remindDays") { if (t.value) a.remindDays = Math.max(1, Math.min(365, +t.value)); }
    else a[t.dataset.f] = t.dataset.f === "price" ? (t.value === "" ? "" : +t.value) : t.value;
    debouncePut(a);
  }
  if (t.id === "ccash") { const exp = +$("#expCash").dataset.v, df = (+t.value || 0) - exp, box = $("#diff"); box.hidden = t.value === ""; box.innerHTML = df === 0 ? `<b style="color:var(--green)">✓ Kassa to‘g‘ri</b>` : `<b style="color:var(--red)">${df > 0 ? "Ortiqcha" : "Kamomad"}: ${money(Math.abs(df))}</b>`; }
});
document.addEventListener("focusout", () => setTimeout(() => { if (STALE && !busy()) safeRender(); }, 50));
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "jdate" && t.value) { V.p.date = t.value; render(); return; }
  if (t.id === "rdate" && t.value) { V.p.date = t.value; render(); return; }
  if (t.tagName === "SELECT" && t.dataset.f === "serviceId") { const a = findA(t.dataset.id); a.serviceId = t.value; if (a.status !== "tugadi") a.price = svc(t.value).price; t.blur(); openVisit(a.id); persist(putDoc("appts", a)); return; }
  if (t.dataset.f === "remindDays" && t.value) { flushDebounce(true); t.blur(); openVisit(t.dataset.id); return; }
  if (t.matches("input[type=file][data-photo]")) { await addPhotos(t.files, t.dataset.appt, t.dataset.photo); return; }

      const r = await persist(api("POST", "/api/restore", new Blob([file], { type: "application/json" })), "Zaxiradan tiklandi");
      if (r) { try { const me = await api("GET", "/api/me"); CU = me.me; applyState(me.state); render(); } catch (e) { } }

});
document.addEventListener("submit", async e => {
  e.preventDefault(); lastAct = Date.now(); const f = e.target;
  const btn = $('button[type="submit"]', f); if (btn && btn.disabled) return;
  const lockBtn = on => { if (btn) btn.disabled = on; };
  if (f.id === "loginForm") {
    lockBtn(true); const err = await login($("#lg").value, $("#lp").value); lockBtn(false);
    if (err) { $("#lerr").textContent = err; $("#lerr").hidden = false; } return;
  }
  if (f.id === "passForm") {
    const err = m => { $("#pw_err").textContent = m; $("#pw_err").hidden = false; };
    if ($("#pw_new").value !== $("#pw_new2").value) return err("Yangi parollar bir xil emas");
    lockBtn(true);
    try { const r = await api("POST", "/api/password", { old: $("#pw_old").value, new: $("#pw_new").value }); CU = r.me; mclose(); render(); toast("Parol o‘zgartirildi"); }
    catch (x) { err(x.message); lockBtn(false); }
    return;
  }
  if (f.id === "openShiftForm") { mclose(); persist(api("POST", "/api/shift/open", { openCash: +$("#ocash", f).value || 0 }), "Smena ochildi · " + nowHM()); return; }
  if (f.id === "closeShiftForm") {
    if (S.appts.some(a => a.status === "keldi")) return toast("Muolajada turgan mijozni avval yakunlang", "err");
    const sh = openShift(), t = shiftTotals(sh), counted = +$("#ccash").value || 0, expected = (+sh.openCash || 0) + t.naqd, note = $("#cnote").value.trim();
    confirmBox(`Smena yopilsinmi?<br><br>Muolajalar: <b>${t.count}</b><br>Jami tushum: <b>${money(t.total)}</b> (naqd ${money(t.naqd)}, karta ${money(t.karta)}, click ${money(t.click)})<br>Kutilgan naqd: <b>${money(expected)}</b><br>Sanalgan: <b>${money(counted)}</b> · Farq: <b>${money(counted - expected)}</b>`, async () => {
      const r = await persist(api("POST", "/api/shift/close", { counted, note }));
      if (!r || !r.shift) return;
      const s = r.shift, tt = r.totals, df = s.counted - s.expected;
      modal(`${mhead("Smena yopildi", `${esc(usr(s.openedBy).name)} · ${hm(s.openedAt)}–${hm(s.closedAt)}`)}<div class="mb"><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="card stat hl"><b class="num">${tt.count}</b><span>Muolaja</span></div><div class="card stat"><b class="num" style="font-size:20px">${money(tt.total)}</b><span>Jami tushum</span></div><div class="card stat"><b class="num" style="font-size:20px">${money(s.counted)}</b><span>Kassada</span></div><div class="card stat"><b class="num" style="font-size:20px;color:${df === 0 ? "var(--green)" : "var(--red)"}">${money(df)}</b><span>Farq</span></div></div></div><div class="mf"><button class="btn pri" data-act="mclose">Tayyor</button></div>`);
    }, "Smenani yopish", false);
    return;
  }
  if (f.id === "apptForm") {
    const err = m => { $("#af_err").textContent = m; $("#af_err").hidden = false; lockBtn(false); };
    lockBtn(true);
    try {
      let cid = $("#af_client") && $("#af_client").value;
      const isNew = $("#af_new") && !$("#af_new").hidden;
      if (isNew) {
        const n = $("#af_name").value.trim(), p = $("#af_phone").value.trim();
        if (!n) return err("Mijoz ismini kiriting"); if (p.replace(/\D/g, "").length < 9) return err("Telefon raqamini to‘liq kiriting");
        const dup = S.clients.find(c => c.phone.replace(/\D/g, "") === p.replace(/\D/g, ""));
        if (dup) cid = dup.id; else { cid = uid(); await putDoc("clients", { id: cid, name: n, phone: p, birth: "", diag: [], notes: "" }); }
      }
      if (!cid) return err("Mijozni tanlang");
      const date = $("#af_date").value, time = $("#af_time").value; if (!date || !time) return err("Sana va vaqtni kiriting");
      const sid = $("#af_svc").value, clash = S.appts.find(a => a.date === date && a.time === time && ["kutilmoqda", "keldi"].includes(a.status));
      await putDoc("appts", { id: uid(), clientId: cid, date, time, serviceId: sid, status: "kutilmoqda", price: svc(sid).price, pay: "naqd", notes: $("#af_note").value.trim(), remindDays: 14 });
      const rid = $("#af_rem").value; if (rid) { const r = S.reminders.find(x => x.id === rid); if (r) await putDoc("reminders", Object.assign({}, r, { done: true })); }
      const nm = isNew ? $("#af_name").value.trim() : cli(cid).name;
      mclose(); await refresh();
      toast(`${nm} · ${fmtD(date)} ${time} ga yozildi${clash ? " (diqqat: shu vaqtda boshqa mijoz ham bor)" : ""}`, clash ? "warn" : "");
    } catch (x) { err(x.message); }
    return;
  }
  if (f.id === "clientForm") {
    const id = f.dataset.id || uid(), err = m => { $("#cf_err").textContent = m; $("#cf_err").hidden = false; lockBtn(false); };
    const data = { id, name: $("#cf_name").value.trim(), phone: $("#cf_phone").value.trim(), birth: $("#cf_birth").value, diag: [...FORM_DIAG], notes: $("#cf_notes").value.trim() };
    if (!data.name) return err("Ismni kiriting"); if (data.phone.replace(/\D/g, "").length < 9) return err("Telefon raqamini to‘liq kiriting");
    lockBtn(true);
    try { await putDoc("clients", data); mclose(); await refresh(); if (!f.dataset.id) go("mijoz", { id }); toast("Mijoz saqlandi"); } catch (x) { err(x.message); }
    return;
  }
  if (f.id === "remForm") { const r = { id: uid(), clientId: $("#rf_client").value, date: $("#rf_date").value, reason: $("#rf_reason").value.trim() || "Nazorat ko‘rigi" }; mclose(); persist(putDoc("reminders", r), "Eslatma qo‘shildi: " + fmtD(r.date)); return; }
  if (f.id === "userForm") {
    const id = f.dataset.id || uid(), err = m => { $("#uf_err").textContent = m; $("#uf_err").hidden = false; lockBtn(false); };
    const data = { id, name: $("#uf_name").value.trim(), login: $("#uf_login").value.trim(), role: $("#uf_role").value, active: $("#uf_active").checked };
    if ($("#uf_pass").value) data.password = $("#uf_pass").value;
    lockBtn(true);
    try { await putDoc("users", data); if (id === CU.id) Object.assign(CU, { name: data.name, login: data.login, role: data.role }); mclose(); await refresh(); toast("Xodim saqlandi"); } catch (x) { err(x.message); }
    return;
  }
  if (f.id === "svcForm") { const data = { id: f.dataset.id || uid(), name: $("#sf_name").value.trim(), price: +$("#sf_price").value || 0, dur: +$("#sf_dur").value || 30 }; mclose(); persist(putDoc("services", data), "Xizmat saqlandi"); return; }
  if (f.id === "setForm") { persist(putDoc("settings", { id: "main", clinic: $("#st_clinic").value.trim(), phone: $("#st_phone").value.trim(), lockMin: Math.max(1, +$("#st_lock").value || 20), sms: $("#st_sms").value }), "Sozlamalar saqlandi"); return; }
});
const nowHM = () => hm(Date.now());

async function addPhotos(files, apptId, kind) {
  const a = findA(apptId); if (!a || !files || !files.length) return;
  toast("Rasm yuklanmoqda…");
  let ok = 0;
  for (const file of files) {
    try { const blob = await resizeImage(file, 1600, .85); await api("POST", `/api/photos?appt=${encodeURIComponent(apptId)}&kind=${kind}`, blob); ok++; }
    catch (e) { toast(e.message || "Rasmni yuklab bo‘lmadi", "err"); }
  }
  await refresh(); if (!$("#modal").hidden) openVisit(apptId);
  if (ok) toast(kind === "oldin" ? "“Oldin” rasmi saqlandi" : "“Keyin” rasmi saqlandi");
}
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Rasmni o‘qib bo‘lmadi")); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("Rasmni siqib bo‘lmadi")), "image/jpeg", q);
    };
    img.src = url;
  });
}

/* ---------- timers: clock, due alerts, auto-lock, live sync ---------- */
function tick() {
  if (!CU || !S) return;
  const n = new Date(), clk = $("#clk"); if (clk) clk.textContent = pad(n.getHours()) + ":" + pad(n.getMinutes());
  if (Date.now() - lastAct > (S.settings.lockMin || 20) * 60000) return logout("Harakatsizlik sababli tizimdan chiqildi");
  const t = today();
  for (const a of S.appts) {
    if (a.date !== t || a.status !== "kutilmoqda" || NOTIFIED.has(a.id)) continue;
    const m = minsUntil(a);
    if (m <= 5 && m > -20) { NOTIFIED.add(a.id); beep(); if ($("#modal").hidden) dueModal(a); else toast(`⏰ ${cli(a.clientId).name} — qabul vaqti keldi (${a.time})`, "warn"); }
  }
  if (V.name === "bugun" && $("#modal").hidden) safeRender();
}
let polling = false;
async function poll() {
  if (!CU || !S || polling) return; polling = true;
  try { const r = await api("GET", "/api/version"); if (r.v !== S.v) await refresh(); else if (STALE) safeRender(); } catch (e) { }
  polling = false;
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), { passive: true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("online", poll);

/* ---------- boot ---------- */
(async function boot() {
  applyTheme();
  $("#app").innerHTML = `<div class="empty" style="padding-top:30vh">PODO MASTER yuklanmoqda…</div>`;
  try { const r = await api("GET", "/api/me"); CU = r.me; applyState(r.state); } catch (e) { CU = null; }
  render();
  if (CU && CU.mustChange) passModal(true);
  setTimeout(tick, 2500);
  setInterval(tick, 20000);
  setInterval(poll, 4000);
})();
</script>
